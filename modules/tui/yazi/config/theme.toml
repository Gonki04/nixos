[mgr]
cwd = { fg = "#FFFFFF" }

# Find
find_keyword  = { fg = "#FFFFFF", bold = true, italic = true, underline = true }
find_position = { fg = "#080808", bg = "#D0D0D0", bold = true, italic = true }

# Border
border_symbol = "│"
border_style  = { fg = "#404040" }

[tabs]
active   = { fg = "#FFFFFF", bg = "#222222", bold = true }
inactive = { fg = "#777777", bg = "#080808" }

# Remove rounded powerline symbols
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#080808", bg = "#D0D0D0", bold = true }
normal_alt  = { fg = "#EEEEEE", bg = "#222222" }
select_main = { fg = "#080808", bg = "#FFFFFF", bold = true }
select_alt  = { fg = "#EEEEEE", bg = "#222222" }
unset_main  = { fg = "#080808", bg = "#777777", bold = true }
unset_alt   = { fg = "#EEEEEE", bg = "#222222" }

[status]
# Remove rounded powerline symbols
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep  = { fg = "#404040" }
perm_type = { fg = "#B8B8B8" }
perm_read = { fg = "#EEEEEE" }
perm_write= { fg = "#FFFFFF" }
perm_exec = { fg = "#777777" }

[input]
border   = { fg = "#404040" }
selected = { reversed = true }

[pick]
border   = { fg = "#404040" }
active   = { fg = "#FFFFFF", bold = true }

[confirm]
border   = { fg = "#404040" }
title    = { fg = "#FFFFFF" }

# Force all file types to a single text color to prevent random bright highlights
[filetype]
rules = [
    { url = "*", fg = "#EEEEEE" }
]

[indicator]
padding = { open = " ", close = " " }
